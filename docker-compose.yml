# ═══════════════════════════════════════════════════════════════════════════
#  OmniX Platform — docker-compose.yml
#  للتشغيل المحلي والإنتاج على أي Docker server
#  الاستخدام:
#    Dev:  docker compose up -d
#    Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ═══════════════════════════════════════════════════════════════════════════

name: omnix

services:

  # ─── PostgreSQL 16 ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: omnix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       omnixplatform
      POSTGRES_USER:     omnix
      POSTGRES_PASSWORD: ${DB_PASSWORD:-omnix_dev_pass_2025}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - omnix_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnix -d omnixplatform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis 7 ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: omnix_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-omnix_redis_2025}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - omnix_backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-omnix_redis_2025}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnix_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ASP.NET Core
      ASPNETCORE_ENVIRONMENT:     ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS:            http://+:5000
      PORT:                       5000
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false

      # Database
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=omnixplatform;
        Username=omnix;Password=${DB_PASSWORD:-omnix_dev_pass_2025};
        Pooling=true;MinPoolSize=2;MaxPoolSize=20;
        CommandTimeout=30;Include Error Detail=true

      # Redis
      ConnectionStrings__Redis: >-
        redis:6379,password=${REDIS_PASSWORD:-omnix_redis_2025},
        abortConnect=false,connectTimeout=5000,syncTimeout=3000

      # JWT — يجب تغييره في الإنتاج
      Jwt__Secret:          ${JWT_SECRET:-OmniX_Dev_Secret_Must_Be_64_Chars_Min_Change_In_Prod_2025!!}
      Jwt__Issuer:          OmniX
      Jwt__Audience:        OmniXClient
      Jwt__ExpiryMinutes:   "60"
      Jwt__RefreshExpiryDays: "7"

      # CORS
      AllowedOrigins__0:    http://localhost:3000
      AllowedOrigins__1:    http://localhost:3001
      AllowedOrigins__2:    http://localhost:19006
      AllowedOrigins__3:    ${FRONTEND_URL:-http://localhost:3000}

      # Paymob (اختياري)
      Paymob__ApiKey:         ${PAYMOB_API_KEY:-}
      Paymob__IntegrationId:  ${PAYMOB_INTEGRATION_ID:-}
      Paymob__IframeId:       ${PAYMOB_IFRAME_ID:-}
      Paymob__HmacSecret:     ${PAYMOB_HMAC_SECRET:-}
      Paymob__BaseUrl:        https://accept.paymob.com/api

      # Firebase / FCM (اختياري)
      Firebase__ServerKey:  ${FIREBASE_SERVER_KEY:-}
      Firebase__ProjectId:  ${FIREBASE_PROJECT_ID:-}
      Firebase__SenderId:   ${FIREBASE_SENDER_ID:-}

      # Anthropic Claude AI (اختياري)
      Anthropic__ApiKey:    ${ANTHROPIC_API_KEY:-}
      Anthropic__Model:     claude-sonnet-4-5
      Anthropic__MaxTokens: "1024"

      # WhatsApp Business API (اختياري — يُفعَّل لاحقاً)
      WhatsApp__PhoneNumberId:    ${WHATSAPP_PHONE_NUMBER_ID:-}
      WhatsApp__AccessToken:      ${WHATSAPP_ACCESS_TOKEN:-}
      WhatsApp__VerifyToken:      ${WHATSAPP_VERIFY_TOKEN:-omnix_webhook_verify}
      WhatsApp__BaseUrl:          https://graph.facebook.com/v18.0

      # Platform Settings
      Platform__DefaultCommissionRate: "0.05"
      Platform__TrialDays:             "14"
      Platform__SupportEmail:          ${SUPPORT_EMAIL:-support@omnix.app}

      # Serilog
      Serilog__MinimumLevel__Default: Information
    ports:
      - "5000:5000"
    volumes:
      - api_logs:/app/logs
      - ./backend/src/OmniX.API/appsettings.json:/app/appsettings.json:ro
    networks:
      - omnix_backend
      - omnix_frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Frontend (Next.js) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: omnix_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL:      http://api:5000/api
      NEXT_PUBLIC_SIGNALR_URL:  http://api:5000
      NEXT_PUBLIC_MALL_SLUG:    ${MALL_SLUG:-omnix-demo}
      NODE_ENV:                 ${NODE_ENV:-development}
    ports:
      - "3000:3000"
    networks:
      - omnix_frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # ─── Nginx Reverse Proxy (للإنتاج) ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: omnix_nginx
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - omnix_frontend
    profiles:
      - production

  # ─── pgAdmin (للتطوير فقط) ──────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: omnix_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@omnix.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - omnix_backend
    profiles:
      - dev-tools
    depends_on:
      postgres:
        condition: service_healthy

# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_logs:
    driver: local
  nginx_logs:
    driver: local
  pgadmin_data:
    driver: local

# ─── Networks ───────────────────────────────────────────────────────────────
networks:
  omnix_backend:
    driver: bridge
    name: omnix_backend
  omnix_frontend:
    driver: bridge
    name: omnix_frontend
